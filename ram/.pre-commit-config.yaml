repos:
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy (release)
        description: Run clippy with --release and deny warnings
        entry: cargo clippy --release --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust source files
        entry: cargo fmt
        language: system
        pass_filenames: false
        always_run: true
